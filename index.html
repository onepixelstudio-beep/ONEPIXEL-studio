<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OnePixel Studio — Editor Profesional de Pixel Art</title>
    <meta name="description" content="OnePixel Studio: Editor profesional de gráficos y animaciones pixel art con un sistema avanzado de capas, paletas personalizadas y una interfaz optimizada para creadores y desarrolladores de videojuegos." />
    <meta name="theme-color" content="#0B0F19" />

    <!-- Web App Manifest for PWA and APK Installation -->
    <link rel="manifest" href="./manifest.json" />
    <!-- Official Favicon & App Icon -->
    <link rel="icon" type="image/png" href="./icon.png" />
    <link rel="apple-touch-icon" href="./icon.png" />
    
    <!-- Service Worker Registration for PWA / PWABuilder -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function() {
          navigator.serviceWorker.register('./sw.js', { scope: './' })
            .then(function(reg) {
              console.log('[PWA] Service Worker registrado exitosamente con scope:', reg.scope);
            })
            .catch(function(err) {
              console.warn('[PWA] Error registrando Service Worker:', err);
            });
        });
      }
    </script>
    
    <!-- Google Fonts Preconnect & Imports -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Quicksand:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
